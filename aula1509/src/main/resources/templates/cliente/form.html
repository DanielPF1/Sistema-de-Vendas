<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::head}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Cliente</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS personalizado -->
    <link rel="stylesheet" th:href="@{/css/css.css}">
</head>


<main th:fragment="main">
    <div class="container mt-4">
        <h2 class="mb-4">Formulário de Cliente</h2>

        <form th:action="@{/{tipo}/save(tipo=${cliente.nomeClasse()})}"
              th:object="${cliente}" method="post" class="needs-validation" novalidate>


            <input type="hidden" th:field="*{id}">

            <div class="mb-3" th:if="${cliente.tipoObjeto('clientePF')}">
                <label for="nome" class="form-label">Nome</label>

                <input type="text"
                       id="nome"
                       th:field="*{nome}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid' : ''"
                       placeholder="Nome completo">

                <div class="invalid-feedback"
                     th:if="${#fields.hasErrors('nome')}"
                     th:errors="*{nome}">
                </div>
            </div>


            <div class="mb-3" th:if="${cliente.tipoObjeto('clientePJ')}">
                <label for="razaoSocial" class="form-label">Razão Social</label>

                <input type="text"
                       id="razaoSocial"
                       th:field="*{razaoSocial}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('razaoSocial')} ? 'is-invalid' : ''"
                       placeholder="Razão social">

                <div class="invalid-feedback"
                     th:if="${#fields.hasErrors('razaoSocial')}"
                     th:errors="*{razaoSocial}">
                </div>
            </div>


            <div class="mb-3" th:if="${cliente.tipoObjeto('clientePF')}">
                <label for="cpf" class="form-label">CPF</label>

                <input type="text"
                       id="cpf"
                       th:field="*{cpf}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('cpf')} ? 'is-invalid' : ''"
                       placeholder="CPF">

                <div class="invalid-feedback"
                     th:if="${#fields.hasErrors('cpf')}"
                     th:errors="*{cpf}">
                </div>
            </div>


            <div class="mb-3" th:if="${cliente.tipoObjeto('clientePJ')}">
                <label for="cnpj" class="form-label">CNPJ</label>

                <input type="text"
                       id="cnpj"
                       th:field="*{cnpj}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('cnpj')} ? 'is-invalid' : ''"
                       placeholder="CNPJ">

                <div class="invalid-feedback"
                     th:if="${#fields.hasErrors('cnpj')}"
                     th:errors="*{cnpj}">
                </div>
            </div>


            <div class="mt-4">
                <button type="submit" class="btn btn-primary">Enviar</button>
                <a th:href="@{/${cliente.nomeClasse()}/list}" class="btn btn-secondary ms-2">Cancelar</a>
            </div>

        </form>
    </div>
</main>

</html>
