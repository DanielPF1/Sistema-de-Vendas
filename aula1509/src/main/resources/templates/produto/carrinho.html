<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::head}, ~{::main})}" xmlns:th="http://www.thymeleaf.org" lang="pt-BR">

<head th:replace="~{fragments/head :: head(~{::link})}">
    <title>List Produto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Seu CSS personalizado -->
    <link rel="stylesheet" th:href="@{/css/css.css}">

</head>

<body>
<main class="container mt-4">
    <h1>Seu Carrinho</h1>

    <table border="1">
        <thead>
        <tr>
            <th>Produto</th>
            <th>Valor</th>
            <th>Quantidade</th>
            <th>Subtotal</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="item : ${itens}">
            <td th:text="${item.produto.nome}"></td>
            <td th:text="${item.produto.valor}"></td>
            <td th:text="${item.quantidade}"></td>
            <td th:text="${item.subtotal}"></td>
        </tr>
        </tbody>
    </table>

    <h2>Total: R$ <span th:text="${total}"></span></h2>

    <a href="/venda/finalizar"><button>Finalizar Venda</button></a>
</main>
</body>

</html>
