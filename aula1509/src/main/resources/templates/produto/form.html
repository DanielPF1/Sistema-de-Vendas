<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::head}, ~{::main})}" xmlns:th="http://www.thymeleaf.org" lang="pt-BR">

<head th:replace="~{fragments/head :: head(~{::link})}">
    <title>List Produto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Seu CSS personalizado -->
    <link rel="stylesheet" th:href="@{/css/css.css}">

</head>
<body>
<main class="container mt-4">
    <h1 class="mb-4 text-center">Formulário Produto</h1>
<form class="container" th:action="${produto.id == null ? '/produto/save' : '/produto/update'}"
      th:object="${produto}" method="post">
    <input type="hidden" th:field="*{id}">
    <input type="text" th:field="*{descricao}" placeholder="Descricao">
    <input type="number" th:field="*{valor}" placeholder="Valor">
    <input type="submit" value="Enviar">
</form>
</main>
</body>
</html>
