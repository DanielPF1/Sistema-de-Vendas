<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::head}, ~{::main})}" xmlns:th="http://www.thymeleaf.org" lang="pt-BR">

<head th:replace="~{fragments/head :: head(~{::link})}">
    <title>List Produto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Seu CSS personalizado -->
    <link rel="stylesheet" th:href="@{/css/css.css}">

</head>

        <body>
        <main class="container mt-4">
        <table class="table table-striped table-bordered">
            <thead class="table-primary">
            <tr>
                <th>Id</th>
                <th>Descrição</th>
                <th>Valor</th>
                <th id="novoProduto"> <a th:href="@{/produto/form}"> Novo Produto </a> </th>
            </tr>
            </thead>
            <tr th:each="p : ${produtos}">
                <td th:text="${p.id}"> </td>
                <td th:text="${p.descricao}"> </td>
                <td th:text="${p.valor}"> </td>
                <td> <a th:href="@{/produto/edit/{id}(id=${p.id})}">Editar</a> </td>
                <td> <a onclick="return window.confirm('Tem certeza que deseja excluir este registro?')"
                        th:href="@{/produto/remove/{id}(id=${p.id})}">Excluir</a> </td>
            </tr>
        </table>
    </main>
</body>

</html>
