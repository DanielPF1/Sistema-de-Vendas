<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::head}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Carrinho de Compras</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/css.css}">
</head>

<main class="container mt-4">

    <h3 class="mb-3">Carrinho</h3>

    <table class="table table-sm table-striped">
        <thead>
        <tr>
            <th>Produto</th>
            <th>Qtd</th>
            <th>Subtotal</th>
            <th></th>
        </tr>
        </thead>

        <tbody>
        <tr th:if="${session.venda == null or #lists.isEmpty(session.venda.items)}">
            <td colspan="4">Carrinho vazio</td>
        </tr>

        <tr th:each="item, var : ${session.venda.items}">
            <td th:text="${item.produto.descricao}">Produto</td>
            <td>
                <form th:action="@{/venda/atualizar-quantidade}" method="post" class="d-flex align-items-center gap-2">

                    <input type="hidden" name="produtoId" th:value="${item.produto.id}" />

                    <input type="number"
                           name="quantidade"
                           th:value="${item.quantidade}"
                           min="1"
                           class="form-control form-control-sm"
                           style="width: 70px" />

                    <button type="submit" class="btn btn-sm btn-primary">
                        Atualizar
                    </button>
                </form>

            </td>
            <td>
                R$
                <span th:text="${#numbers.formatDecimal(item.total(), 1, 'COMMA', 2, 'POINT')}">0,00</span>
            </td>
            <td>
                <a th:href="@{/venda/remove/{i}(i=${var.index})}"
                   onclick="return confirm('Remover este item?')">
                    Remover
                </a>
            </td>
        </tr>
        </tbody>

        <tfoot th:if="${session.venda != null and !#lists.isEmpty(session.venda.items)}">
        <tr>
            <th colspan="2">Total</th>
            <th colspan="2">
                R$
                <span th:text="${#numbers.formatDecimal(session.venda.totalVenda, 1, 'COMMA', 2, 'POINT')}">0,00</span>
            </th>
        </tr>
        </tfoot>
    </table>

    <form th:action="@{/venda/finalizar}" method="post"
          th:if="${session.venda != null and !#lists.isEmpty(session.venda.items)}"
          class="mt-3">

        <div class="mb-2">
            <label for="cliente" class="form-label">Cliente</label>

            <input id="cliente"
                   name="nomeCliente"
                   class="form-control"
                   list="listaClientes"
                   placeholder="Digite o nome do cliente">

            <datalist id="listaClientes">
                <option th:each="c : ${clientes}"
                        th:value="${c.nome}"></option>
            </datalist>
        </div>

        <button type="submit" class="btn btn-success w-100">
            Finalizar compra
        </button>
    </form>

</main>

</html>
