<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::head}, ~{::main})}" xmlns:th="http://www.thymeleaf.org" lang="pt-BR">

<head th:replace="~{fragments/head :: head(~{::link})}">
    <title>Detalhe da Venda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Seu CSS personalizado -->
    <link rel="stylesheet" th:href="@{/css/css.css}">

</head>

<body>
<main class="container mt-4">

    <h1 class="mb-4 text-center">Detalhes da Venda</h1>

    <div class="card p-3 mb-4">
        <p><strong>ID da Venda:</strong> <span th:text="${venda.id}"></span></p>
        <p><strong>Data da Venda:</strong> <span th:text="${venda.dataVenda}"></span></p>
        <p><strong>Cliente: </strong> <span th:text="${venda.cliente.getNome()}"></span> </p>
    </div>

    <h2 class="mb-3">Itens da Venda</h2>

    <table class="table table-striped table-bordered">
        <thead class="table-primary">
        <tr>
            <th>Produto</th>
            <th>Quantidade</th>
            <th>Valor Unitário (R$)</th>
            <th>Total do Item (R$)</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${items}">
            <td th:text="${item.produto.descricao}"></td>
            <td th:text="${item.quantidade}"></td>
            <td th:text="${#numbers.formatDecimal(item.produto.valor, 1, 2)}"></td>
            <td th:text="${#numbers.formatDecimal(item.total(), 1, 2)}"></td>
        </tr>
        </tbody>
    </table>

    <div class="text-end mt-3">
        <h4>
            Total da Venda:
            <span th:text="${#numbers.formatDecimal(venda.totalVenda, 1, 2)}"></span> R$
        </h4>
    </div>

    <div class="mt-4">
        <a th:href="@{/venda/list}" class="btn btn-secondary">Voltar</a>
    </div>

</main>
</body>
</html>
