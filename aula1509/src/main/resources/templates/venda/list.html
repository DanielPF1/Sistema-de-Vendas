<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::head}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head">
    <meta charset="UTF-8">
    <title>Lista de Vendas</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Seu CSS personalizado -->
    <link rel="stylesheet" th:href="@{/css/css.css}">
</head>

<main th:fragment="main">
    <div class="container mt-4">
        <h2 class="mb-3">Lista de Vendas</h2>


        <form class="row g-3 mb-4" method="get" th:action="@{/venda/list}">
            <div class="col-md-4">
                <label class="form-label">Data Inicial</label>
                <input type="date"
                       class="form-control"
                       name="data"
                       th:value="${data}">
            </div>

            <div class="col-md-4 d-flex align-items-end">
                <button class="btn btn-primary w-100" type="submit">Filtrar</button>
            </div>


        <table class="table table-striped table-hover">
            <thead class="table-primary">
            <tr>
                <th>ID</th>
                <th>Data</th>
                <th>Total</th>
                <th>Cliente</th>
                <th>Ações</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="v : ${vendas}">
                <td th:text="${v.id}"></td>
                <td th:text="${v.dataVenda}"></td>
                <td th:text="${v.totalVenda}"></td>
                <td th:text="${v.cliente != null ? v.cliente.getNome() : 'Sem cliente'}"></td>
                <td>
                    <a th:href="@{/venda/detail/{id}(id=${v.id})}" class="btn btn-sm btn-outline-primary">
                        Detalhes
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

</html>
