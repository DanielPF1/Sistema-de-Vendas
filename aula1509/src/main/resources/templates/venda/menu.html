<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::head}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org" lang="pt-BR">

<head th:replace="~{fragments/head :: head(~{::link})}">
    <title>Menu de Produtos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/css.css}">
</head>

<main class="container mt-4">
    <div class="row">

        <!-- PRODUTOS -->
        <div class="col-md-8">
            <div class="row">
                <div class="col-md-4 mb-3" th:each="produto : ${produtos}">
                    <div class="card">

                        <img class="card-img-top"
                             th:src="@{/imagens/{img}(img=${produto.imagens})}"
                             th:alt="${produto.descricao}">

                        <div class="card-body">
                            <h5 class="card-title" th:text="${produto.descricao}">Produto</h5>

                            <p class="card-text">
                                R$
                                <span th:text="${#numbers.formatDecimal(produto.valor, 1, 'COMMA', 2, 'POINT')}">0,00</span>
                            </p>

                            <a class="btn btn-primary"
                               th:href="@{/venda/add/{idProduto}(idProduto=${produto.id})}">
                                Comprar
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- CARRINHO -->
        <div class="col-md-4">
            <h4>Carrinho</h4>

            <table class="table table-sm table-striped">
                <thead>
                <tr>
                    <th>Produto</th>
                    <th>Qtd</th>
                    <th>Subtotal</th>
                    <th></th>
                </tr>
                </thead>

                <tbody>

                <!-- CARRINHO VAZIO -->
                <tr th:if="${session.venda == null or #lists.isEmpty(session.venda.items)}">
                    <td colspan="4">Carrinho vazio</td>
                </tr>

                <!-- ITENS DO CARRINHO -->
                <tr th:each="item, var : ${session.venda.items}">
                    <td th:text="${item.produto.descricao}">Produto</td>
                    <td th:text="${item.quantidade}">1</td>
                    <td>
                        R$
                        <span th:text="${#numbers.formatDecimal(item.total(), 1, 'COMMA', 2, 'POINT')}">0,00</span>
                    </td>
                    <td>
                        <a th:href="@{/venda/remove/{i}(i=${var.index})}"
                           onclick="return confirm('Remover este item?')">
                            Remover
                        </a>
                    </td>
                </tr>

                </tbody>

                <!-- TOTAL -->
                <tfoot th:if="${session.venda != null and !#lists.isEmpty(session.venda.items)}">
                <tr>
                    <th colspan="2">Total</th>
                    <th colspan="2">
                        R$
                        <span th:text="${#numbers.formatDecimal(session.venda.totalVenda, 1, 'COMMA', 2, 'POINT')}">0,00</span>
                    </th>
                </tr>
                </tfoot>
            </table>

            <!-- FORM FINALIZAR COMPRA -->
            <form th:action="@{/venda/finalizar}" method="post"
                  th:if="${session.venda != null and !#lists.isEmpty(session.venda.items)}">

                <div class="mb-2">
                    <label for="cliente" class="form-label">Cliente</label>

                    <input id="cliente"
                           name="nomeCliente"
                           class="form-control"
                           list="listaClientes"
                           placeholder="Digite o nome do cliente">

                    <datalist id="listaClientes">
                        <option th:each="c : ${clientes}"
                                th:value="${c.nome}">
                        </option>
                    </datalist>
                </div>

                <button type="submit" class="btn btn-success w-100">
                    Finalizar compra
                </button>

            </form>

        </div>

    </div>
</main>

</html>
