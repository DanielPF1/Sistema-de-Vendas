<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::head}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org" lang="pt-BR">

<head th:replace="~{fragments/head :: head(~{::link})}">
    <title>Menu de Produtos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/css.css}">
</head>

<main class="container mt-4">
    <div class="row">
        <div th:if="${mensagemSucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${mensagemSucesso}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>


        <!-- PRODUTOS -->
        <div class="col-md-8">
            <div class="row">
                <div class="col-md-4 mb-3" th:each="produto : ${produtos}">
                    <div class="card">

                        <img class="card-img-top"
                             th:src="@{/imagens/{img}(img=${produto.imagens})}"
                             th:alt="${produto.descricao}">

                        <div class="card-body">
                            <h5 class="card-title" th:text="${produto.descricao}">Produto</h5>

                            <p class="card-text">
                                R$
                                <span th:text="${#numbers.formatDecimal(produto.valor, 1, 'COMMA', 2, 'POINT')}">0,00</span>
                            </p>

                            <a class="btn btn-primary"
                               th:href="@{/venda/add/{idProduto}(idProduto=${produto.id})}">
                                Comprar
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>


    </div>
</main>

</html>
